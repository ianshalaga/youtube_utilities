<!doctype html>
<html>
  <head>
    <meta charset="UTF-8" />

    <script src="https://cdn.tailwindcss.com"></script>

    <link rel="stylesheet" href="skins/deaths_door.css" />
  </head>

  <body class="bg-transparent overflow-hidden">
    <div id="overlay-root">
      <!-- BACKDROP -->
      <div id="afk-backdrop"></div>

      <!-- GLOBAL PARTICLES -->
      <div id="global-particles"></div>

      <!-- CENTER HUD -->
      <div id="afk-content">
        <div id="sigil-container">
          <svg viewBox="0 0 200 200" id="sigil">
            <circle cx="100" cy="100" r="85" class="ring outer" />
            <circle cx="100" cy="100" r="60" class="ring mid" />
            <circle cx="100" cy="100" r="35" class="ring inner" />

            <g class="runes">
              <line x1="100" y1="5" x2="100" y2="45" />
              <line x1="195" y1="100" x2="155" y2="100" />
              <line x1="100" y1="195" x2="100" y2="155" />
              <line x1="5" y1="100" x2="45" y2="100" />
            </g>
          </svg>
        </div>
      </div>
    </div>

    <script src="core/afk.js"></script>
  </body>
</html>
