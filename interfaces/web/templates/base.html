{% load static %}
<!DOCTYPE html>
<html lang="es">
    <head>
        <meta charset="UTF-8">
        <meta name="viewport" content="width=device-width, initial-scale=1.0">
        <title>{% block title %}⚙️ YouTube Utilities{% endblock %}</title>
        <link rel="preconnect" href="https://fonts.googleapis.com">
        <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
        <link href="https://fonts.googleapis.com/css2?family=Inknut+Antiqua:wght@400;500;600;700&family=Rajdhani:wght@600;700&display=swap"
              rel="stylesheet">
        <link rel="stylesheet" href="{% static 'css/main.css' %}">
        {% block extra_head %}{% endblock %}
    </head>
    <body class="min-h-screen flex flex-col bg-gray-950 font-sans text-gray-100 antialiased">
        <header class="border-b border-white/10 bg-gray-900">
            <div class="mx-auto flex max-w-7xl items-center px-4 py-4 sm:px-6 lg:px-8">
                <a href="{% url 'home:index' %}"
                   class="font-display text-lg font-semibold tracking-tight text-white transition-colors hover:text-red-400 sm:text-xl">
                    YouTube Utilities
                </a>
            </div>
        </header>
        <main class="mx-auto w-full max-w-7xl flex-1 px-4 py-4 sm:px-6 sm:py-8 lg:px-8">
            {% block content %}{% endblock %}
        </main>
        <footer class="border-t border-white/10 bg-gray-900">
            <div class="mx-auto max-w-7xl px-4 py-4 text-center text-sm text-gray-400 sm:px-6 lg:px-8">
                YouTube Utilities · Herramientas de Seyfer Studios
            </div>
        </footer>
        {% block extra_scripts %}{% endblock %}
    </body>
</html>
