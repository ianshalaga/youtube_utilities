<a href="{% url application.url_name %}"
   class="group relative z-0 block h-full rounded-xl border-2 border-red-500/40 bg-gray-900 p-5 no-underline transition-all duration-200 ease-out hover:z-10 hover:scale-[1.01] hover:border-green-500 hover:bg-slate-800 focus-visible:outline-2 focus-visible:outline-offset-4 focus-visible:outline-green-500">
    <div class="flex items-center gap-2">
        {% if application.url_name == "video_music:index" %}
            <span role="img" aria-label="Música">🎵</span>
        {% elif application.url_name == "video_joiner:index" %}
            <span role="img" aria-label="Unión de vídeos">🎬</span>
        {% elif application.url_name == "audio_converter:index" %}
            <span role="img" aria-label="Audio">🎧</span>
        {% else %}
            <span role="img" aria-label="Herramienta">🛠️</span>
        {% endif %}
        <h2 class="font-display text-xl font-semibold text-white transition-colors duration-200 group-hover:text-indigo-300">
            {{ application.name }}
        </h2>
    </div>
    <p class="mt-3 text-base leading-relaxed text-gray-400">{{ application.description }}</p>
</a>
