{% extends "base.html" %}
{% block title %}Navegador de archivos | YouTube Utilities{% endblock %}
{% block content %}
    <section class="file-browser">
        <header class="file-browser__header">
            <h1>Navegador de archivos</h1>
            <p>Selecciona una unidad, navega por sus directorios y elige una ruta.</p>
        </header>
        <div class="file-browser__toolbar">
            <button type="button" id="file-browser-drives">Unidades</button>
            <button type="button" id="file-browser-parent" disabled>Directorio superior</button>
            <button type="button" id="file-browser-refresh" disabled>Actualizar</button>
        </div>
        <div class="file-browser__location">
            <label for="file-browser-path">Ruta actual</label>
            <input type="text"
                   id="file-browser-path"
                   readonly
                   placeholder="Selecciona una unidad o un directorio">
        </div>
        <p id="file-browser-status" role="status" aria-live="polite">Selecciona «Unidades» para comenzar.</p>
        <div class="file-browser__listing">
            <ul id="file-browser-entries" aria-label="Contenido del directorio">
            </ul>
        </div>
        <div class="file-browser__selection">
            <label for="file-browser-selected-path">Ruta seleccionada</label>
            <input type="text"
                   id="file-browser-selected-path"
                   readonly
                   placeholder="Ninguna ruta seleccionada">
            <button type="button" id="file-browser-confirm" disabled>Confirmar selección</button>
        </div>
    </section>
{% endblock %}
